name: SeqCheck
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install digest-pinned Fe locally
        run: python3 scripts/install_fe.py
      - name: Native, EVM and independent replay checks
        env:
          RAYON_NUM_THREADS: "2"
        run: python3 scripts/check.py
